name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37.0 Platform & Build-Tools
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare CI Gradle properties
        run: |
          sed -i '/proxy/Id' android/gradle.properties
          sed -i 's/-Xmx1280m/-Xmx3072m/' android/gradle.properties

      - name: Run unit tests & build Release APK
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease --console=plain

      - name: Verify built APK
        run: ls -lh build/app/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/apk/release/app-release.apk
          generate_release_notes: true
